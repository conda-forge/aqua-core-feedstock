schema_version: 1

context:
  version: "1.2.3"
  python_min: "3.12"

package:
  name: aqua-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aqua-core/aqua_core-${{ version }}.tar.gz
  sha256: 50b9189c362ef6dfcb84d22271978cc90f2058ea1965edb5df4aa9b72ff19e7d

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - aqua = aqua.core.console.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }},<3.15
    - eccodes >=2.41.0,<2.50
    - python-eccodes >=2.41.0,<2.50
    - netcdf4
    - hdf5
    - h5py >=3.12.1
    - astropy-healpix
    - boto3
    - cartopy >=0.24.1
    - cdo >=2.5.0,<2.6.1
    - cfgrib
    - dask-core
    - dask
    - distributed
    - fastparquet
    - filelock
    - gcsfs
    - icechunk
    - intake >=2.0.9
    - intake-xarray >=2.0.0
    - jinja2
    - kerchunk
    - matplotlib-base
    - metpy
    - numpy
    - pandas >=3.0.0
    - pypdf
    - pyyaml
    - regionmask
    - ruamel.yaml
    - s3fs >=2026.1.0
    - scipy
    - seaborn
    - smmregrid ==0.1.6
    - xarray >=2025.12.0
    - zarr >=3.0

tests:
  - python:
      imports:
        - aqua
      # pip check disabled: upstream requires "eccodeslib" (PyPI name), which is
      # provided on conda-forge by the eccodes, ECMWF does not provide matching
      pip_check: false
      python_version: ${{ python_min }}.*
  - script:
      - aqua --help

about:
  homepage: https://github.com/DestinE-Climate-DT/AQUA/
  repository: https://github.com/DestinE-Climate-DT/AQUA/
  documentation: https://aqua.readthedocs.io/en/latest/index.html
  summary: AQUA; a model evaluation framework for high-resolution climate model simulations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - oloapinivad
